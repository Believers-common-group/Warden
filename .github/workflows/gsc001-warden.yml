name: GSC-001 Warden advisory contract
on:
  pull_request:
    paths:
      - 'genesis/ocm/**'
      - 'tests/test_gsc001_decision.py'
      - '.github/workflows/gsc001-warden.yml'
  push:
    branches: [genesis]
    paths:
      - 'genesis/ocm/**'
      - 'tests/test_gsc001_decision.py'
      - '.github/workflows/gsc001-warden.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check advisory policy floors and fail-closed boundaries
        run: python3 -m unittest discover -s tests -p test_gsc001_decision.py -v
