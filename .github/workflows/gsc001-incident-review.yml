name: GSC-001 incident review gate
on:
  pull_request:
    paths:
      - 'genesis/ocm/gsc001_incident_review.py'
      - 'genesis/ocm/INCIDENT_REVIEW_R03.md'
      - 'tests/test_gsc001_incident_review.py'
      - '.github/workflows/gsc001-incident-review.yml'
  push:
    branches: [genesis]
    paths:
      - 'genesis/ocm/gsc001_incident_review.py'
      - 'genesis/ocm/INCIDENT_REVIEW_R03.md'
      - 'tests/test_gsc001_incident_review.py'
      - '.github/workflows/gsc001-incident-review.yml'
permissions:
  contents: read
jobs:
  offline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p test_gsc001_incident_review.py -v
