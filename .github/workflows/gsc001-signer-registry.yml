name: GSC-001 signer lifecycle review
on:
  pull_request:
    paths: ['genesis/gsc001/signer_registry.py','genesis/gsc001/test_signer_registry.py','genesis/gsc001/SIGNER_REGISTRY_R05.md','.github/workflows/gsc001-signer-registry.yml']
  push:
    branches: [genesis]
    paths: ['genesis/gsc001/signer_registry.py','genesis/gsc001/test_signer_registry.py','genesis/gsc001/SIGNER_REGISTRY_R05.md','.github/workflows/gsc001-signer-registry.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'cryptography>=42,<48'
      - name: Test two-person signed enrolment, expiry and revocation
        working-directory: genesis/gsc001
        run: python3 -m unittest test_signer_registry.py -v
