genesis_branch:
  repository: Believers-common-group/Warden
  role: consent_authority_policy_control
  integration_branch: genesis
  release_branch: main
  source_authority: Believers-common-group/genesis-stack
  first_point_of_contact: true
  production_branch: false
  workstream_pattern: genesis/<workstream>
  promotion:
    requires_validation: true
    target: main
  upstream_dependencies:
    - Genesis architecture
    - DigitalMe identity principal
    - Network-Based Registry
  release_rule: Warden changes integrate here before promotion to the stable branch.
